# Production identity server: Keycloak + PostgreSQL behind the server's Caddy.
#
#   cp .env.example .env   # fill it in
#   docker compose up -d
#
# Caddy runs in its own container and reaches Keycloak as `amt-keycloak:8080` over
# the Docker network named by PROXY_NETWORK. On the host, Keycloak answers only on
# 127.0.0.1:8080 (for an SSH tunnel, and for the setup scripts' checks). PostgreSQL and Keycloak's
# management port (9000: health, metrics) are not published at all.
#
# Service names are prefixed `amt-` because the proxy network is shared with other
# projects: a plain `keycloak` or `db` would clash with theirs in Docker's DNS.
name: amt-keycloak

services:
  amt-keycloak-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      retries: 10

  amt-keycloak:
    # Published by .github/workflows/keycloak-image.yml. To try a local change first:
    #   docker build -t ghcr.io/milliontechies/amt-keycloak:dev . and set KEYCLOAK_IMAGE to it.
    image: ${KEYCLOAK_IMAGE:-ghcr.io/milliontechies/amt-keycloak:26.8.2-1}
    command: start --optimized
    restart: unless-stopped
    depends_on:
      amt-keycloak-db:
        condition: service_healthy
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME:-https://auth.amilliontechies.com}
      # The admin console has its own hostname (Caddy refuses it on KC_HOSTNAME).
      # Set KC_HOSTNAME_ADMIN=http://localhost:8080 to reach it only by SSH tunnel.
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN:-http://localhost:8080}
      KC_HTTP_ENABLED: "true" # Caddy terminates TLS
      KC_PROXY_HEADERS: xforwarded
      KC_DB_URL: jdbc:postgresql://amt-keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD}
      # Only for the very first start. Remove both from .env once your own admin exists.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal, proxy]
    healthcheck:
      # The image has no curl; ask the management port for readiness over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

networks:
  internal:
  proxy:
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env to the Docker network Caddy is on}
    external: true

volumes:
  db-data:
